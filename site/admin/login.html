<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Admin Login | Portfolio</title>
  <link rel="stylesheet" href="/assets/admin/admin.css">
  <script src="/assets/admin/admin.js" defer></script>
</head>
<body data-admin-page="login">
  <main class="login-shell">
    <a class="brand" href="/" aria-label="Portfolio home"><span class="brand-mark">P</span> PORTFOLIO <span class="brand-label">ADMIN</span></a>
    <section class="login-card" aria-labelledby="login-title">
      <div class="eyebrow"><span class="status-dot"></span> SECURE ADMIN ACCESS</div>
      <h1 id="login-title">Welcome back<span class="accent">.</span></h1>
      <p class="muted">Sign in to manage your contact inbox.</p>
      <form id="login-form" novalidate>
        <label class="field-label" for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required maxlength="254" placeholder="you@example.com">
        <label class="field-label password-label" for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Enter your password">
          <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p id="login-error" class="form-message" role="alert" hidden></p>
        <button id="login-submit" class="button button-primary login-submit" type="submit"><span>Sign in</span><span class="button-arrow" aria-hidden="true">→</span></button>
      </form>
      <p class="login-foot">Protected by your secure admin session.</p>
    </section>
    <a class="back-link" href="/">← Back to portfolio</a>
  </main>
</body>
</html>
